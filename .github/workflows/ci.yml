name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run
      - name: Dogfood portable fixtures
        run: node bin/fixtureguard.js check
      - name: Validate SARIF serialization
        shell: bash
        run: |
          node bin/fixtureguard.js check --format sarif > fixtureguard.sarif
          node -e 'const fs = require("fs"); const report = JSON.parse(fs.readFileSync("fixtureguard.sarif", "utf8")); if (report.version !== "2.1.0") process.exit(1)'
